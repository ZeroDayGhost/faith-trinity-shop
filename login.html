<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Faith Trinity Shop</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
    <div class="login-pattern login-pattern-top" aria-hidden="true"></div>
    <div class="login-pattern login-pattern-bottom" aria-hidden="true"></div>

    <main class="login-wrap">
        <section class="login-card">
            <div class="login-showcase">
                <div class="login-cart-mark" aria-hidden="true">
                    <svg viewBox="0 0 48 48">
                        <path d="M9 11h5l4.2 18.4a4 4 0 0 0 3.9 3.1h13.1a4 4 0 0 0 3.8-2.9l3.1-11.1H18" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.2"/>
                        <path d="M22 39h.1M35 39h.1" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="5"/>
                        <path d="M5.8 18h5.7M7.8 25h5.7" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2.8"/>
                    </svg>
                </div>
                <h1>Faith Trinity Shop</h1>
                <p class="login-subtitle">Shop Sales Management</p>
                <span class="login-mini-line"></span>
                <p class="login-tagline">Manage your sales,<br>grow your business.</p>
            </div>

            <div class="login-form-side">
                <div class="login-heading">
                    <h2>Welcome Back</h2>
                    <p>Sign in to continue to your account</p>
                </div>

                <div id="loginMessage" class="message-area"></div>

                <form id="loginForm" class="form-stack" autocomplete="off">
                    <div class="input-shell">
                        <label class="sr-only" for="identifier">Email or username</label>
                        <span class="input-icon" aria-hidden="true" data-icon="user"></span>
                        <input id="identifier" name="identifier" type="text" required autofocus placeholder="Email or username">
                    </div>
                    <div class="input-shell">
                        <label class="sr-only" for="password">Password</label>
                        <span class="input-icon" aria-hidden="true" data-icon="lock"></span>
                        <input id="password" name="password" type="password" required placeholder="Password">
                        <button class="icon-button input-action" type="button" data-password-toggle aria-label="Show password">
                            <span data-icon="eye"></span>
                        </button>
                    </div>
                    <button class="login-submit" type="submit">
                        <span>Login</span>
                        <span data-icon="arrow-right"></span>
                    </button>
                </form>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
